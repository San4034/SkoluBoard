<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  /* Failsafe: show any uncaught error on screen instead of a black page.
     Must stay the first script on the page and use only ES3 syntax. */
  (function () {
    function paint(msg) {
      try {
        var box = document.getElementById('__err');
        if (!box) {
          box = document.createElement('div');
          box.id = '__err';
          box.setAttribute('style',
            'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;' +
            'margin:0;padding:2em;overflow:auto;background:#111;color:#9aa;' +
            'font:14px/1.6 monospace;white-space:pre-wrap;cursor:auto');
          (document.body || document.documentElement).appendChild(box);
        }
        var row = document.createElement('div');
        row.appendChild(document.createTextNode('SkoluBoard error: ' + msg));
        box.appendChild(row);
      } catch (e) {}
    }
    function report(o) {
      /* Land the raw error in the server log: these clients often cannot be
         debugged remotely and many collapse every error location to ":1:1". */
      try {
        var x = new XMLHttpRequest();
        x.open('POST', '/api/client-error', true);
        x.setRequestHeader('Content-Type', 'application/json');
        x.send(JSON.stringify(o));
      } catch (e) {}
    }
    window.onerror = function (message, source, line, col, err) {
      report({
        message: String(message),
        source:  String(source || ''),
        line:    line || 0,
        col:     col || 0,
        stack:   (err && err.stack) ? String(err.stack) : ''
      });
      paint(message + '  (' + (source || '?') + ':' + (line || 0) + ':' + (col || 0) + ')');
      return false;
    };
    window.addEventListener && window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      report({ message: 'unhandledrejection: ' + ((r && (r.message || r)) || e),
               stack: (r && r.stack) ? String(r.stack) : '' });
      paint('unhandled promise rejection: ' + ((r && (r.message || r)) || e));
    });
  })();
  </script>
  <title>SkoluBoard — Login</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #ecfdf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .wrap {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo img {
      height: 85px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    .logo-sub {
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
      padding: 28px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #009EF5;
      box-shadow: 0 0 0 3px rgba(0,158,245,.12);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }

    .btn-primary { background: #009EF5; color: #fff; }
    .btn-primary:hover { background: #007DCF; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #b91c1c;
      margin-bottom: 16px;
    }

    .error-box.show { display: block; }

    .info-box {
      display: none;
      background: #e6f6ff;
      border: 1px solid #9dd9fc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #0065a8;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .info-box.show { display: block; }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="/SkoluBoard-logo.png" alt="SkoluBoard">
    <div class="logo-sub">Display management</div>
  </div>

  <div class="card">
    <div class="card-title" id="card-title">Sign in</div>
    <div class="card-sub" id="card-sub">Enter your username and password</div>

    <div class="info-box" id="info-box"></div>
    <div class="error-box" id="error-box"></div>

    <form id="form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <div class="form-group" id="password2-group" style="display:none">
        <label>Confirm password</label>
        <input type="password" id="password2" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
    </form>
  </div>

  <div class="footer-note">SkoluBoard &copy; 2026</div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
