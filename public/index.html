<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  /* Failsafe: show any uncaught error on screen instead of a black page.
     Must stay the first script on the page and use only ES3 syntax. */
  (function () {
    function paint(msg) {
      try {
        var box = document.getElementById('__err');
        if (!box) {
          box = document.createElement('div');
          box.id = '__err';
          box.setAttribute('style',
            'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;' +
            'margin:0;padding:2em;overflow:auto;background:#111;color:#9aa;' +
            'font:14px/1.6 monospace;white-space:pre-wrap;cursor:auto');
          (document.body || document.documentElement).appendChild(box);
        }
        var row = document.createElement('div');
        row.appendChild(document.createTextNode('SkoluBoard error: ' + msg));
        box.appendChild(row);
      } catch (e) {}
    }
    window.onerror = function (message, source, line, col) {
      paint(message + '  (' + (source || '?') + ':' + (line || 0) + ':' + (col || 0) + ')');
      return false;
    };
    window.addEventListener && window.addEventListener('unhandledrejection', function (e) {
      paint('unhandled promise rejection: ' + ((e && e.reason && (e.reason.message || e.reason)) || e));
    });
  })();
  </script>
  <title>SkoluBoard</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    /*
     * Old-device notes: this page must render on ~2016 signage engines
     * (Chrome/WebView 39+). Every modern feature below is paired with a plain
     * fallback declared first, so an engine that cannot parse the modern line
     * simply keeps the fallback:
     *   - `inset`            -> top/right/bottom/left longhand
     *   - `clamp()`          -> a fixed px value tuned for 1920x1080
     *   - `color-mix()`      -> not used; plain colour + `opacity` instead
     *                           (old TV engines mis-resolve color-mix to black)
     *   - `backdrop-filter`  -> -webkit- prefix + the panel already has an
     *                           opaque-enough rgba background
     *   - flex `gap`         -> adjacent-sibling margins
     *   - CSS custom props   -> a literal value ahead of every var()
     */
    :root { --transition: 1s; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    #slideshow { position: relative; width: 100%; height: 100vh; }

    .slide {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      opacity: 0; z-index: 0;
      transition: opacity 1s ease-in-out;
      transition: opacity var(--transition) ease-in-out;
      background: #000;
    }

    .slide.active { opacity: 1; z-index: 1; }

    /* Blur background layer */
    .slide-bg {
      position: absolute;
      top: -40px; right: -40px; bottom: -40px; left: -40px;
      background-size: cover;
      background-position: center;
      -webkit-filter: blur(35px) brightness(0.28) saturate(1.4);
      filter: blur(35px) brightness(0.28) saturate(1.4);
      z-index: 0;
    }

    .slide-content {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }

    /* Image modes */
    .slide-img {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; display: block;
    }

    .slide-img.mode-cover {
      width: 100%; height: 100%;
      max-width: none; max-height: none;
      object-fit: cover;
    }

    /* Video */
    .slide-video {
      width: 100%; height: 100%;
      object-fit: contain; display: block; background: #000;
    }

    .slide-video.mode-cover { object-fit: cover; }

    /* YouTube */
    .slide-iframe { width: 100%; height: 100%; border: none; display: block; }
    .slide-yt-wrap { width: 100%; height: 100%; }
    .slide-yt-wrap iframe { width: 100% !important; height: 100% !important; border: none; display: block; }

    /* Error */
    .slide-error {
      color: #444;
      font-size: 18px;
      font-size: clamp(14px, 2vw, 22px);
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 2em;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* Empty / loading state */
    #status-screen {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-family: system-ui, sans-serif;
    }
    #status-screen > * + * { margin-top: 14px; }

    #status-screen.show { display: flex; }
    .st-icon  { font-size: 52px; }
    .st-title { font-size: 28px; font-size: clamp(18px, 3vw, 32px); font-weight: 700; color: #475569; }
    .st-hint  { font-size: 16px; font-size: clamp(12px, 1.5vw, 18px); color: #64748b; }

    /* Progress bar */
    #progress-bar {
      position: fixed; bottom: 0; left: 0;
      height: 3px; width: 0;
      background: rgba(255,255,255,.5);
      box-shadow: 0 0 10px rgba(255,255,255,.2);
      z-index: 999; pointer-events: none;
    }

    /* Slide counter */
    #slide-counter {
      position: fixed; bottom: 10px; right: 16px;
      color: rgba(255,255,255,.25);
      font-size: 13px;
      font-family: system-ui, sans-serif;
      letter-spacing: 2px;
      z-index: 999; pointer-events: none;
    }

    /* Offline / stale-data badge (shown only while serving cached data) */
    #offline-badge {
      position: fixed; top: 10px; left: 16px;
      display: none;
      background: rgba(176,32,32,.82);
      color: #fff;
      font: 600 13px/1 system-ui, sans-serif;
      letter-spacing: .5px;
      padding: 6px 11px; border-radius: 8px;
      z-index: 1000; pointer-events: none;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    #offline-badge.show { display: block; }

    /* ── Schedule slides ──────────────────────────────────────────────── */
    .sched-slide {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 3.2vh 2vw 2.2vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    .sched-deco {
      position: absolute; right: -2%; top: 0; bottom: 0; width: 32%;
      background: repeating-linear-gradient(
        -55deg, transparent 0, transparent 18px,
        rgba(255,255,255,.04) 18px, rgba(255,255,255,.04) 20px
      );
      pointer-events: none; z-index: 0;
    }
    .sched-header {
      width: 96%;
      display: flex; align-items: flex-end; justify-content: space-between;
      color: #fff;
      color: var(--sched-text, #fff);
      text-shadow: 0 2px 14px rgba(0,0,0,.28);
      z-index: 1; position: relative;
    }
    .sched-title {
      font-size: 44px;
      font-size: clamp(24px, 4.4vh, 60px);
      font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; line-height: 1;
    }
    .sched-date-block {
      text-align: right;
    }
   
    .sched-table-wrap {
      position: relative; z-index: 1;
      width: 96%; flex: 1; min-height: 0;
      margin: 1.4vh 0;
      display: flex; flex-direction: column; justify-content: flex-start;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 12px;
      border-radius: clamp(6px,1.2vh,16px);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: schedTableIn .7s cubic-bezier(.22,.61,.36,1) both;
    }
    .sched-table {
      width: 100%; border-collapse: collapse; table-layout: fixed;
    }
    .sched-td-clip { overflow: hidden; text-overflow: ellipsis; max-width: 0; }
    .sched-table thead tr { background: rgba(0,0,0,.2); }
    .sched-table th {
      /* Follow the theme "Text colour". color-mix() was only a subtle dim, but
         old TV engines mis-resolve it to black — use the colour + opacity. */
      color: #fff;
      color: var(--sched-text, #fff);
      opacity: .86;
      font-size: 16px;
      font-size: var(--td-fs, 16px);
      font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 8px 14px;
      padding: var(--td-pv, 8px) 14px;
      text-align: center; border-bottom: 1px solid rgba(255,255,255,.22);
      white-space: nowrap; line-height: 1;
    }
    .sched-table td {
      color: #fff;
      color: var(--sched-text, #fff);
      font-size: 17px;
      font-size: var(--td-fs, 17px);
      padding: 7px 14px;
      padding: var(--td-pv, 7px) 14px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      text-align: center; white-space: nowrap;
      overflow: hidden; vertical-align: middle; line-height: 1;
    }
    .sched-table tbody tr:last-child td { border-bottom: none; }
    .sched-table tbody tr {
      animation: schedRowIn .42s ease both;
      animation-delay: calc(var(--row-i, 0) * 50ms + 350ms);
    }
    .sched-lesson {
      font-size: 16px;
      font-size: clamp(11px, 1.5vh, 20px);
      font-weight: 500; letter-spacing: .04em;
      line-height: 1; min-height: 1.3em;
    }
    .sched-clock {
      font-size: 36px;
      font-size: clamp(20px, 3.4vh, 48px);
      font-weight: 600; letter-spacing: .1em;
      font-variant-numeric: tabular-nums; line-height: 1;
      margin-top: .2em;
    }
    .sched-date {
      font-size: 18px;
      font-size: clamp(12px, 1.7vh, 24px);
      font-weight: 400; letter-spacing: .06em;
      margin-top: .25em;
    }
    .sched-footer {
      position: relative; z-index: 1;
      width: 96%;
      display: flex; align-items: center; justify-content: flex-end;
      /* Follow the theme "Text colour" (was color-mix(), broken on old TVs). */
      color: #fff;
      color: var(--sched-text, #fff);
    }
    .sched-footer > * + * { margin-left: 1.2vw; }
    .sched-logo {
      height: 42px;
      height: clamp(26px,4vh,54px); width: auto; object-fit: contain;
    }
    .sched-school-name {
      font-size: 14px;
      font-size: clamp(9px,1.3vh,16px);
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      opacity: .72;
    }
    .sched-page {
      font-size: 14px;
      font-size: clamp(9px,1.35vh,16px);
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 20px;
      padding: .2em .85em; letter-spacing: .05em;
    }
    @keyframes schedTableIn {
      from { opacity: 0; transform: translateY(2.5vh); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes schedRowIn {
      from { opacity: 0; transform: translateX(-1.5vw); }
      to   { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<div id="slideshow"></div>
<div id="progress-bar"></div>
<div id="slide-counter"></div>
<div id="offline-badge">⚠ Offline — showing last update</div>

<div id="status-screen">
  <div class="st-icon" id="st-icon">⏳</div>
  <div class="st-title" id="st-title">Loading…</div>
  <div class="st-hint"  id="st-hint"></div>
</div>

<script src="/js/player.js"></script>
</body>
</html>
